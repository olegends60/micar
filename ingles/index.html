<style>
:root{
  --bg:#eef1f8; --card:#fff; --ink:#14213d; --muted:#5c6378; --line:#dde3ef;
  --blue:#1d3c8f; --blue-soft:#e6ecfa; --red:#c8323c; --red-soft:#fbe9ea;
  --green:#1f8a4c; --green-soft:#e3f4ea; --amber:#b76e00; --amber-soft:#fdf1dc;
  --r:16px; --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 16px rgba(20,33,61,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
h1,h2,h3{line-height:1.2;margin:0 0 8px}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 16px;font:600 1rem system-ui,sans-serif;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.plain{background:transparent;color:var(--blue);padding:8px 10px;min-height:auto}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;font:500 1rem system-ui,sans-serif;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}

.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.bar{height:10px;background:#e3e8f2;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.bar.red>i{background:var(--red)} .bar.green>i{background:var(--green)} .bar.amber>i{background:var(--amber)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .back{font-size:1.4rem;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 8px}
.top .bar{flex:1}
.jake{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#3a5fcd);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem;position:relative}
.avatar.talking::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.bubble{background:var(--blue-soft);border-radius:4px 16px 16px 16px;padding:11px 14px;flex:1}
.bubble.me{background:#fff;border:1px solid var(--line);border-radius:16px 4px 16px 16px;margin-left:48px}
.bubble.coach{background:var(--amber-soft);border-radius:12px;margin-left:58px}
.en{font-weight:600}
.es{color:var(--muted);font-size:.92rem}
.hidden-text{filter:blur(6px);user-select:none;cursor:pointer}
.say{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:6px 12px;font:600 .875rem system-ui,sans-serif;cursor:pointer}
.say:active{background:#d3defa}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.tip{background:var(--amber-soft);border-radius:10px;padding:10px 12px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}

.mic.on{animation:micpulse 1s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(200,50,60,.5)}100%{box-shadow:0 0 0 22px rgba(200,50,60,0)}}
.w-ok{color:var(--green);font-weight:700} .w-bad{color:var(--red);font-weight:700;text-decoration:underline wavy}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav[hidden]{display:none}
.pron{color:var(--red);margin:1px 0}
.easy{background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
.dotnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.flash .word{font-size:1.7rem;font-weight:800}
.lyric{padding:10px 12px;border-radius:10px;margin:4px 0;border:1px solid transparent;cursor:pointer}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px 4px;font:600 .88rem system-ui,sans-serif;background:#fff;color:var(--muted);cursor:pointer}
.tabs button.sel{background:var(--blue);color:#fff}
.lock{opacity:.6}
.nav button{flex:1;max-width:128px;background:none;border:0;font:600 .72rem system-ui,sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
.nav button b{font-size:1.35rem;font-weight:400}
.nav button.act{color:var(--blue)}
.lesson-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin:8px 0;background:#fff;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.lesson-row .dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:700}
.lesson-row.done .dot{background:var(--green);color:#fff}
.lesson-row.locked{opacity:.5}
.hero{background:linear-gradient(135deg,#14213d,#1d3c8f);color:#fff}
.hero .muted{color:#c9d3ef}
.big{font-size:2.6rem;font-weight:800;line-height:1}
.speedsel{display:flex;gap:6px;flex-wrap:wrap}
.speedsel button{flex:1;min-width:70px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font:600 .82rem system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.speedsel button.sel{border-color:var(--red);background:var(--red-soft);color:var(--red)}
input[type=text],textarea,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font:1rem system-ui,sans-serif;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;font-weight:600;box-shadow:var(--shadow);max-width:90%}
.center{text-align:center}
.mt{margin-top:12px} .mb0{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav" hidden>
  <button data-go="home"><b>🏠</b>Inicio</button>
  <button data-go="path"><b>📚</b>Lecciones</button>
  <button data-go="talk"><b>💬</b>Hablar</button>
  <button data-go="fast"><b>⚡</b>Oído</button>
  <button data-go="more"><b>☰</b>Más</button>
</nav>
<script src="data.js"></script>
<script src="extra.js"></script>
<script src="course.js"></script>
<script src="more.js"></script>
<script src="words.js"></script>
<script>
'use strict';
/* =========================================================
   Estado (se guarda en el teléfono con localStorage)
   ========================================================= */
const KEY = 'ingles-jake-v1';
const DEFAULT = {
  profile: null,              // respuestas de la encuesta
  level: null,                // A1..C1
  skills: { listening: 0, speaking: 0, grammar: 0, vocab: 0 },
  done: {},                   // lecciones terminadas: id -> % de aciertos
  convs: {},                  // conversaciones terminadas
  mistakes: [],               // errores para repasar
  streak: { last: null, count: 0 },
  xp: 0,
  history: [],                // últimas actividades
  settings: { speed: 'nativo', voice: null, showText: false }
};
let S = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return Object.assign(structuredClone(DEFAULT), d, { settings: Object.assign({}, DEFAULT.settings, d.settings) }); } catch (e) {}
  return structuredClone(DEFAULT);
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

/* =========================================================
   Utilidades
   ========================================================= */
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function toast(msg, ms = 2200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function touchStreak() {
  const t = today(); if (S.streak.last === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const ys = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
  S.streak.count = S.streak.last === ys ? S.streak.count + 1 : 1; S.streak.last = t;
}
function updSkill(skill, correct, weight = 0.15) {
  if (!skill || !(skill in S.skills)) return;
  S.skills[skill] = Math.round(S.skills[skill] * (1 - weight) + (correct ? 100 : 0) * weight);
}
function addXP(n) { S.xp += n; touchStreak(); save(); }
function addMistake(m) {
  const key = m.q || m.en;
  if (S.mistakes.some(x => (x.q || x.en) === key)) return;
  S.mistakes.unshift(Object.assign({ ts: Date.now() }, m));
  S.mistakes = S.mistakes.slice(0, 60);
}

/* =========================================================
   Voz: hablar (inglés de EE. UU.) y escuchar (reconocimiento)
   ========================================================= */
// Las velocidades están bien separadas para que se note la diferencia.
// Además, "lento" habla por pedacitos con pausas: así se nota aunque la voz ignore la velocidad.
const SPEEDS = { lento: 0.65, normal: 0.92, nativo: 1.15, turbo: 1.55 };
const SPEED_LABEL = { lento: '🐢 Lento', normal: 'Normal', nativo: '🇺🇸 Nativo', turbo: '⚡ Súper rápido' };
let voices = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function bestVoice() {
  if (S.settings.voice) { const v = voices.find(v => v.voiceURI === S.settings.voice); if (v) return v; }
  // Preferimos voces naturales/neuronales de EE. UU.
  const pref = [/natural/i, /online/i, /neural/i, /google us english/i, /aria|jenny|guy|davis|tony|christopher|eric|steffan/i, /samantha|alex/i];
  for (const p of pref) { const v = voices.find(v => p.test(v.name)); if (v) return v; }
  return voices[0] || null;
}
let speakToken = 0;
// Divide una frase en pedacitos de 2-4 palabras respetando comas y puntos
function chunks(text) {
  const out = [];
  text.split(/(?<=[,.!?;:—])\s+/).forEach(part => {
    const w = part.split(/\s+/).filter(Boolean);
    for (let i = 0; i < w.length; i += 3) out.push(w.slice(i, i + 3).join(' '));
  });
  return out;
}
function speakOne(text, rate, token) {
  return new Promise(res => {
    if (token !== speakToken) return res();
    const u = new SpeechSynthesisUtterance(text);
    const v = bestVoice(); if (v) u.voice = v;
    u.lang = 'en-US'; u.rate = rate;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speak(text, speed) {
  if (!('speechSynthesis' in window)) { toast('Tu navegador no tiene voz. Usa Chrome, Edge o Safari.'); return; }
  speechSynthesis.cancel();
  const token = ++speakToken;
  const sp = speed || S.settings.speed;
  const av = document.querySelectorAll('.avatar.live');
  av.forEach(a => a.classList.add('talking'));
  if (sp === 'lento' && text.split(/\s+/).length > 3) {
    for (const c of chunks(text)) {
      if (token !== speakToken) break;
      await speakOne(c, SPEEDS.lento, token);
      await new Promise(r => setTimeout(r, 260));
    }
  } else {
    await speakOne(text, SPEEDS[sp] || 1, token);
  }
  if (token === speakToken) av.forEach(a => a.classList.remove('talking'));
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = !!SR;
let rec = null;
let micOk = false;
// Pide permiso del micrófono una vez para detectar si hay micrófono y si está permitido
async function ensureMic() {
  if (micOk || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    st.getTracks().forEach(t => t.stop()); micOk = true;
  } catch (e) {
    throw new Error(e.name === 'NotFoundError' ? 'audio-capture' : 'not-allowed');
  }
}
// onPartial(texto): muestra lo que va entendiendo mientras hablas
function listen(onPartial) {
  return new Promise(async (res, rej) => {
    if (!SR) return rej(new Error('nosr'));
    if (!window.isSecureContext) return rej(new Error('insecure'));
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    try { await ensureMic(); } catch (e) { return rej(e); }
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 4;
    let done = false, partial = '';
    const finish = alts => { if (done) return; done = true; res(alts); };
    rec.onresult = e => {
      const r = e.results[e.results.length - 1];
      if (r.isFinal) { const alts = []; for (const a of r) alts.push(a.transcript); finish(alts); try { rec.stop(); } catch (x) {} }
      else { partial = Array.from(e.results).map(x => x[0].transcript).join(' '); if (onPartial) onPartial(partial); }
    };
    rec.onerror = e => { if (done) return; if (partial && e.error === 'no-speech') return finish([partial]); done = true; rej(new Error(e.error)); };
    rec.onend = () => { if (done) return; if (partial) return finish([partial]); done = true; rej(new Error('no-speech')); };
    try { rec.start(); } catch (e) { done = true; rej(e); }
    setTimeout(() => { if (!done) try { rec.stop(); } catch (x) {} }, 12000);
  });
}
function stopListen() { try { rec && rec.stop(); } catch (e) {} }

// Normaliza para comparar lo que dijiste con lo esperado
const CONTR = { "i'm": 'i am', "you're": 'you are', "he's": 'he is', "she's": 'she is', "it's": 'it is', "we're": 'we are', "they're": 'they are', "i've": 'i have', "you've": 'you have', "we've": 'we have', "i'll": 'i will', "you'll": 'you will', "i'd": 'i would', "don't": 'do not', "doesn't": 'does not', "didn't": 'did not', "can't": 'can not', "cannot": 'can not', "won't": 'will not', "isn't": 'is not', "aren't": 'are not', "haven't": 'have not', "that's": 'that is', "what's": 'what is', "let's": 'let us', "should've": 'should have', "could've": 'could have', "would've": 'would have', "how's": 'how is', "there's": 'there is', 'gonna': 'going to', 'wanna': 'want to', 'gotta': 'got to' };
function norm(s) {
  return s.toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean)
    .map(w => CONTR[w] || w).join(' ').split(' ').filter(Boolean);
}
function compare(target, said) {
  const t = norm(target), s = norm(said);
  // LCS de palabras para saber cuáles dijiste bien
  const dp = Array.from({ length: t.length + 1 }, () => Array(s.length + 1).fill(0));
  for (let i = 1; i <= t.length; i++) for (let j = 1; j <= s.length; j++)
    dp[i][j] = t[i - 1] === s[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const hit = Array(t.length).fill(false);
  let i = t.length, j = s.length;
  while (i > 0 && j > 0) { if (t[i - 1] === s[j - 1]) { hit[i - 1] = true; i--; j--; } else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--; }
  return { score: pct(dp[t.length][s.length], t.length), words: t, hit };
}
function bestCompare(target, alts) { return alts.map(a => Object.assign(compare(target, a), { said: a, target })).sort((a, b) => b.score - a.score)[0]; }

/* =========================================================
   Componentes pequeños
   ========================================================= */
let SAYS = []; // textos para los botones ▶
function sayBtn(text, label = '▶', speed) { SAYS.push({ text, speed }); return `<button class="say" data-say="${SAYS.length - 1}">${label}</button>`; }
function jake(en, es, opts = {}) {
  const hide = opts.hide;
  return `<div class="jake"><div class="avatar live">J</div><div class="bubble">
    <div class="en ${hide ? 'hidden-text' : ''}" ${hide ? 'data-reveal title="Toca para ver el texto"' : ''}>${esc(en)}</div>
    ${es ? `<div class="es ${hide ? 'hidden-text' : ''}" ${hide ? 'data-reveal' : ''}>${esc(es)}</div>` : ''}
    <div class="row mt wrap">${sayBtn(en, '▶ Escuchar')}${sayBtn(en, '🐢 Lento', 'lento')}${sayBtn(en, '⚡', 'turbo')}</div></div></div>`;
}
function topBar(progress, backTo = 'home') {
  return `<div class="top"><button class="back" data-go="${backTo}" aria-label="Salir">✕</button>${progress != null ? `<div class="bar"><i style="width:${progress}%"></i></div>` : '<div class="grow"></div>'}</div>`;
}
function speedPicker() {
  return `<div class="speedsel">${Object.keys(SPEEDS).map(k => `<button data-speed="${k}" class="${S.settings.speed === k ? 'sel' : ''}">${SPEED_LABEL[k]}</button>`).join('')}</div>`;
}
function micBlock(id) {
  if (!canListen) return `<p class="small muted">Tu navegador no reconoce la voz (usa Google Chrome en Android o computadora). Puedes escribir tu respuesta.</p>`;
  return `<div class="center mt"><button class="mic" id="${id}" aria-label="Hablar">🎤</button><p class="small muted mt" id="${id}-st">Toca y habla en inglés</p></div>`;
}

/* =========================================================
   Router
   ========================================================= */
let screen = 'home';
function go(name, arg) {
  stopListen(); speakToken++; if ('speechSynthesis' in window) speechSynthesis.cancel();
  SAYS = [];
  screen = name;
  const nav = document.getElementById('nav');
  const showNav = S.level && ['home', 'path', 'talk', 'fast', 'settings', 'review', 'more', 'cards', 'guide', 'songs'].includes(name);
  nav.hidden = !showNav;
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('act', b.dataset.go === name));
  (SCREENS[name] || SCREENS.home)(arg);
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-say],[data-speed],[data-reveal]');
  if (!t) return;
  if (t.dataset.go) { if (t.dataset.go === 'home' && !S.level) return go('welcome'); go(t.dataset.go); }
  else if (t.dataset.say != null) { const s = SAYS[+t.dataset.say]; if (s) speak(s.text, s.speed); }
  else if (t.dataset.speed) { S.settings.speed = t.dataset.speed; save(); document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('sel', b === t)); speak('This is how fast I talk.'); }
  else if (t.hasAttribute('data-reveal')) { t.parentElement.querySelectorAll('[data-reveal]').forEach(x => { x.classList.remove('hidden-text'); x.removeAttribute('data-reveal'); }); }
});

const SCREENS = {};

/* =========================================================
   Bienvenida + encuesta
   ========================================================= */
SCREENS.welcome = () => {
  $app.innerHTML = `

const SURVEY = [
  { id: 'name', q: '¿Cómo te llamas?', type: 'text', ph: 'Tu nombre' },
  { id: 'goal', q: '¿Para qué quieres aprender inglés?', type: 'one', options: ['💼 Trabajo', '✈️ Viajar', '🏠 Vivir en EE. UU.', '🎬 Entender series y música', '🎓 Escuela o examen', '🗣️ Platicar con gente'] },
  { id: 'self', q: '¿Cómo calificas tu inglés hoy?', type: 'one', options: ['No sé nada', 'Sé lo básico (saludos, palabras)', 'Me defiendo en conversaciones simples', 'Hablo bastante bien', 'Casi fluido'] },
  { id: 'hard', q: '¿Qué se te hace más difícil? (puedes elegir varias)', type: 'many', options: ['Entender cuando hablan rápido', 'Hablar / pronunciar', 'Gramática', 'Vocabulario', 'Me da pena hablar'] },
  { id: 'time', q: '¿Cuánto tiempo al día puedes practicar?', type: 'one', options: ['5 minutos', '10 minutos', '20 minutos', '30 minutos o más'] }
];
let sv = { i: 0, ans: {} };
SCREENS.survey = () => {
  const item = SURVEY[sv.i];
  const cur = sv.ans[item.id];
  let body = '';
  if (item.type === 'text') body = `<input type="text" id="sv-in" placeholder="${item.ph}" value="${esc(cur || '')}" autocomplete="given-name">`;
  else body = item.options.map((o, k) => {
    const sel = item.type === 'many' ? (cur || []).includes(k) : cur === k;
    return `<button class="opt ${sel ? 'sel' : ''}" data-k="${k}">${esc(o)}</button>`;
  }).join('');
  $app.innerHTML = `${topBar(pct(sv.i, SURVEY.length + 1), 'welcome')}
  <p class="tag">Encuesta · ${sv.i + 1} de ${SURVEY.length}</p>
  <div class="card mt"><h2>${esc(item.q)}</h2>${body}</div>
  <div class="row">${sv.i > 0 ? '<button class="btn ghost" id="sv-back">Atrás</button>' : ''}<button class="btn grow" id="sv-next">Siguiente</button></div>`;
  $app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (item.type === 'many') { const a = new Set(sv.ans[item.id] || []); a.has(k) ? a.delete(k) : a.add(k); sv.ans[item.id] = [...a]; }
    else sv.ans[item.id] = k;
    SCREENS.survey();
    if (item.type === 'one') setTimeout(next, 180);
  });
  const next = () => {
    if (item.type === 'text') { const v = document.getElementById('sv-in').value.trim(); if (!v) return toast('Escribe tu nombre 🙂'); sv.ans.name = v; }
    else if (sv.ans[item.id] == null || (item.type === 'many' && !sv.ans[item.id].length)) return toast('Elige una opción');
    if (sv.i < SURVEY.length - 1) { sv.i++; SCREENS.survey(); }
    else { S.profile = sv.ans; save(); go('testIntro'); }
  };
  document.getElementById('sv-next').onclick = next;
  const bk = document.getElementById('sv-back'); if (bk) bk.onclick = () => { sv.i--; SCREENS.survey(); };
  const inp = document.getElementById('sv-in'); if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') next(); }; }
};

SCREENS.test = () => {
  const q = PLACEMENT[PT.i];
  const prog = pct(PT.i, PLACEMENT.length);
  let html = `${topBar(prog, 'welcome')}<p class="tag">${q.level} · ${SKILL_NAMES[q.skill]}</p>`;
  if (q.type === 'mc' || q.type === 'listen') {
    const order = shuffle(q.options.map((o, k) => k));
    html += `<div class="card mt">`;
    if (q.type === 'listen') html += `<div class="center"><button class="btn red" id="play">▶ Escuchar audio</button><p class="small muted mt">Velocidad: ${SPEED_LABEL[q.speed]}. Puedes repetirlo.</p></div>`;
    html += `<h2 class="mt">${esc(q.q)}</h2>${order.map(k => `<button class="opt" data-k="${k}">${esc(q.options[k])}</button>`).join('')}
      <button class="opt" data-k="-1" style="color:var(--muted)">🤷 No sé</button></div>`;
    $app.innerHTML = html;
    if (q.type === 'listen') { const p = document.getElementById('play'); p.onclick = () => speak(q.text, q.speed); setTimeout(() => speak(q.text, q.speed), 350); }
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => recordTest(+b.dataset.k === q.a));
  } else {
    html += `<div class="card mt"><h2>Repite esta frase en voz alta</h2>
      <p class="en" style="font-size:1.25rem">${esc(q.text)}</p><p class="es">${esc(q.es)}</p>
      <div class="row">${sayBtn(q.text, '▶ Escuchar', 'normal')}</div>
      ${micBlock('tmic')}<div id="tres"></div></div>
      <button class="btn block ghost" id="skip">${canListen ? 'No puedo hablar ahora (saltar)' : 'Continuar'}</button>`;
    $app.innerHTML = html;
    document.getElementById('skip').onclick = () => recordTest(null);
    const m = document.getElementById('tmic');
    if (m) m.onclick = async () => {
      m.classList.add('on'); document.getElementById('tmic-st').textContent = 'Escuchando...';
      try {
        const alts = await listen(t => document.getElementById('tmic-st').textContent = '🎧 ' + t); const r = bestCompare(q.text, alts);
        m.classList.remove('on');
        document.getElementById('tres').innerHTML = speakResult(r) + `<button class="btn block mt" id="tnext">Siguiente</button>`;
        document.getElementById('tnext').onclick = () => recordTest(r.score >= 70, r.score);
      } catch (e) { m.classList.remove('on'); micError(e, 'tmic-st'); }
    };
  }
};
function recordTest(ok, score) {
  const q = PLACEMENT[PT.i];
  PT.res.push({ level: q.level, skill: q.skill, ok, score });
  PT.i++;
  // Corte temprano: si ya falló casi todo de dos niveles seguidos, no lo torturamos
  const lvlIdx = LEVELS.indexOf(q.level);
  const nextQ = PLACEMENT[PT.i];
  if (nextQ && nextQ.level !== q.level && lvlIdx >= 1) {
    const last2 = PT.res.filter(r => r.ok !== null && (r.level === LEVELS[lvlIdx] || r.level === LEVELS[lvlIdx - 1]));
    if (last2.length >= 5 && pct(last2.filter(r => r.ok).length, last2.length) < 30) PT.i = PLACEMENT.length;
  }
  if (PT.i >= PLACEMENT.length) finishTest(); else SCREENS.test();
}
function finishTest() {
  const res = PT.res;
  // Nivel: el más alto en el que acertaste al menos 60% (contando niveles anteriores con 50%)
  let level = 'A1';
  for (let k = 0; k < LEVELS.length; k++) {
    const r = res.filter(x => x.level === LEVELS[k] && x.ok !== null);
    if (!r.length) break;
    const acc = pct(r.filter(x => x.ok).length, r.length);
    if (acc >= 60) level = LEVELS[k]; else break;
  }
  // Si casi no acertó nada en A1, igual empieza en A1
  const skills = {};
  for (const sk of Object.keys(S.skills)) {
    const r = res.filter(x => x.skill === sk && x.ok !== null);
    if (sk === 'speaking' && r.length) skills[sk] = Math.round(r.reduce((a, x) => a + (x.score || 0), 0) / r.length);
    else skills[sk] = r.length ? pct(r.filter(x => x.ok).length, r.length) : 30;
  }
  // Lo que dijo en la encuesta que se le dificulta pesa un poco
  const hard = (S.profile && S.profile.hard) || [];
  const map = { 0: 'listening', 1: 'speaking', 2: 'grammar', 3: 'vocab' };
  hard.forEach(h => { if (map[h]) skills[map[h]] = Math.max(0, skills[map[h]] - 8); });
  S.level = level; S.skills = skills;
  S.testResults = { date: Date.now(), level, skills: Object.assign({}, skills) };
  touchStreak(); save();
  go('results');
}

function skillBars() {
  return Object.entries(S.skills).map(([k, v]) => {
    const c = v < 40 ? 'red' : v < 70 ? 'amber' : 'green';
    return `<div class="mt"><div class="row"><span class="grow small"><b>${SKILL_NAMES[k]}</b></span><span class="small">${v}%</span></div><div class="bar ${c}"><i style="width:${v}%"></i></div></div>`;
  }).join('');
}

/* =========================================================
   Inicio: lo que sigue según tu nivel y tus puntos débiles
   ========================================================= */
function nextLesson() {
  const order = LESSONS.filter(l => LEVELS.indexOf(l.level) >= LEVELS.indexOf(S.level));
  return order.find(l => !(l.id in S.done)) || LESSONS.find(l => !(l.id in S.done)) || null;
}
function weakest() { return Object.entries(S.skills).sort((a, b) => a[1] - b[1])[0]; }
function maybeLevelUp() {
  const idx = LEVELS.indexOf(S.level);
  const mine = LESSONS.filter(l => l.level === S.level);
  if (idx < LEVELS.length - 1 && mine.length && mine.every(l => (S.done[l.id] || 0) >= 60)) {
    S.level = LEVELS[idx + 1]; save();
    return true;
  }
  return false;
}

  if (!S.level) return go('welcome');
  const name = S.profile && S.profile.name || '';

  const [wk, wv] = weakest();

    listening: { t: 'Entrena tu oído', d: 'Frases a velocidad nativa con reducciones.', go: 'fast', b: '⚡ Oído nativo' },

  $app.innerHTML = `

    <p class="small muted mb0 mt">${doneLvl} de ${lvlLessons.length} lecciones de ${S.level} · ${S.xp} XP</p>
  </div>
  ${nl ? `<div class="card"><p class="tag red">Lección de hoy</p>
    <h2 class="mt">${esc(nl.title)}</h2><p class="muted">${esc(nl.goal)}</p>
    <button class="btn block" id="go-lesson">Empezar lección</button></div>`
    : `<div class="card"><h2>🏆 ¡Terminaste todas las lecciones!</h2><p>Sigue con conversaciones y el oído nativo para mantenerte.</p></div>`}
  ${(() => { const nc = COURSE.find(l => !(l.id in S.done)); return nc ? `<div class="card"><p class="tag">📘 Mi curso · Libro 1</p><h3 class="mt">Lesson ${nc.num}: ${esc(nc.title)}</h3><button class="btn block ghost" id="go-course" data-cid="${nc.id}">Repasar esta lección de mi curso</button></div>` : ''; })()}
  <div class="card"><p class="tag amber">Para pulir · ${SKILL_NAMES[wk]} ${wv}%</p>
    <h3 class="mt">${polish.t}</h3><p class="muted">${polish.d}</p>
    <button class="btn block ghost" data-go="${polish.go}">${polish.b}</button></div>
  <div class="grid2">
    <button class="card btn ghost" style="flex-direction:column;height:auto;padding:16px" data-go="talk"><span style="font-size:1.6rem">💬</span>Conversar</button>
    <button class="card btn ghost" style="flex-direction:column;height:auto;padding:16px" data-go="cards"><span style="font-size:1.6rem">🧠</span>Memoria (${dueCards().length})</button>
    <button class="card btn ghost" style="flex-direction:column;height:auto;padding:16px" data-go="review"><span style="font-size:1.6rem">🔁</span>Repaso (${S.mistakes.length})</button>
    <button class="card btn ghost" style="flex-direction:column;height:auto;padding:16px" data-go="guide"><span style="font-size:1.6rem">❓</span>Dudas</button>
  </div>

  const gl = document.getElementById('go-lesson'); if (gl) gl.onclick = () => startLesson(nl.id);
  const gc = document.getElementById('go-course'); if (gc) gc.onclick = () => startLesson(gc.dataset.cid);
};

SCREENS.path = () => {
  const myIdx = LEVELS.indexOf(S.level);
  const courseDone = COURSE.filter(l => l.id in S.done).length;
  $app.innerHTML = `<h1>Tus lecciones</h1>
    <div class="card"><div class="row"><h2 class="grow mb0">📘 Mi curso · Libro 1</h2><span class="tag">${courseDone}/${COURSE.length}</span></div>
      <p class="small muted">Las mismas lecciones y temas de tu curso Beginners, en el mismo orden, explicadas paso por paso. Úsalas para repasar la lección que estás viendo en tus clases.</p>
      <details ${courseDone < COURSE.length ? 'open' : ''}><summary class="small"><b>Ver las 14 lecciones</b></summary>
      ${COURSE.map(l => { const done = l.id in S.done; return `<button class="lesson-row ${done ? 'done' : ''}" data-lesson="${l.id}"><span class="dot">${done ? '✓' : l.num}</span><span class="grow"><b>Lesson ${l.num}: ${esc(l.title)}</b><br><span class="small muted">${SKILL_NAMES[l.focus]}${done ? ' · ' + S.done[l.id] + '%' : ''}</span></span><span>›</span></button>`; }).join('')}</details></div>
    <h2 class="mt">Camino por niveles</h2><p class="muted">Empiezan en tu nivel. Puedes repasar niveles anteriores cuando quieras.</p>` +
    LEVELS.map((lv, k) => {
      const ls = LESSONS.filter(l => l.level === lv);
      const locked = k > myIdx + 1;
      return `<div class="card"><div class="row"><h2 class="grow mb0">${lv} · ${LEVEL_NAMES[lv]}</h2>${k === myIdx ? '<span class="tag red">Tu nivel</span>' : ''}${locked ? '<span class="tag">🔒</span>' : ''}</div>
      ${ls.map((l, n) => {
        const done = l.id in S.done;
        return `<button class="lesson-row ${done ? 'done' : ''} ${locked ? 'locked' : ''}" data-lesson="${l.id}" ${locked ? 'disabled' : ''}>
          <span class="dot">${done ? '✓' : n + 1}</span><span class="grow"><b>${esc(l.title)}</b><br><span class="small muted">${SKILL_NAMES[l.focus]}${done ? ' · ' + S.done[l.id] + '%' : ''}</span></span><span>›</span></button>`;
      }).join('')}
      ${locked ? '<p class="small muted mb0">Se desbloquea al terminar el nivel anterior.</p>' : ''}</div>`;
    }).join('');
  $app.querySelectorAll('[data-lesson]').forEach(b => b.onclick = () => startLesson(b.dataset.lesson));
};

/* =========================================================
   Lección paso a paso
   ========================================================= */
let L = null;
const STEP_NAME = { intro: '¿Qué vamos a aprender?', vocab: 'Palabras clave', explain: 'Explicación', memo: 'Trucos para recordar', listen: 'Escucha a un nativo', speak: 'Tu turno: habla', quiz: 'Practica', summary: 'Resumen' };
function startLesson(id) {
  const lesson = LESSONS.concat(COURSE).find(l => l.id === id);
  const steps = ['intro', 'vocab', 'explain'].concat(lesson.memo ? ['memo'] : [], ['listen', 'speak', 'quiz', 'summary']);
  L = { lesson, steps, step: 0, ok: 0, total: 0, qi: 0, si: 0, quiz: shuffle(lesson.quiz), missed: [] };
  go('lesson');
}
function lessonNext() { L.step++; go('lesson'); }
SCREENS.lesson = () => {
  const l = L.lesson, STEPS = L.steps, st = STEPS[L.step];
  const prog = pct(L.step, STEPS.length - 1);
  let h = `${topBar(prog, 'path')}<p class="tag">${l.level} · Paso ${Math.min(L.step + 1, STEPS.length)} de ${STEPS.length} · ${STEP_NAME[st]}</p>`;
  if (st === 'intro') {
    h += `<div class="card mt"><h1>${esc(l.title)}</h1>
      <h3 class="mt">🎯 ¿Qué vamos a aprender?</h3><p>${esc(l.goal)}</p>
      <h3>💡 ¿Por qué importa?</h3><p class="mb0">${esc(l.why)}</p></div>
      <div class="card">${jake(l.intro.en, l.intro.es, { hide: true })}<p class="small muted mt mb0">Primero escucha. Toca el texto borroso solo si no entendiste.</p></div>
      <button class="btn block" id="nx">Vamos</button>`;
    $app.innerHTML = h; setTimeout(() => speak(l.intro.en), 350);
  } else if (st === 'vocab') {
    h += `<div class="card mt"><h2>Palabras y frases clave</h2><p class="muted small">Toca ▶ para escuchar cada una.</p>
      ${l.vocab.map(([en, es, pr]) => { const t = en.split(' / ')[0].replace(/\s*\(.*\)/, ''); return `<div class="list-item"><div><div class="en">${esc(en)}</div>${pr ? `<div class="small pron">🗣️ se dice: <b>${esc(pr)}</b></div>` : ''}<div class="es">${esc(es)}</div></div><div class="row">${sayBtn(t)}${sayBtn(t, '🐢', 'lento')}</div></div>`; }).join('')}
      <p class="small muted mt mb0">🗣️ "se dice" es una guía aproximada leída en español. Escucha siempre el audio.</p></div>
      <button class="btn block" id="nx">Entendido</button>`;
    $app.innerHTML = h;
  } else if (st === 'explain') {
    h += `<div class="card mt explain"><h2>Te explico</h2>${l.explain}

function mcHandler(answer, cb) {
  const opts = $app.querySelectorAll('.opt');
  opts.forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ok = k === answer;
    opts.forEach(o => { o.disabled = true; if (+o.dataset.k === answer) o.classList.add('ok'); });
    if (!ok) b.classList.add('bad');
    cb(ok, k);
  });
}
function speakResult(r) {
  // Alinea lo que dijiste con la frase original (respetando contracciones como I'm)
  const toks = (r.target || r.words.join(' ')).split(/\s+/).filter(Boolean);
  const flat = []; toks.forEach((t, ti) => norm(t).forEach(w => flat.push({ w, ti })));
  const said = norm(r.said || '');
  const dp = Array.from({ length: flat.length + 1 }, () => Array(said.length + 1).fill(0));
  for (let i = 1; i <= flat.length; i++) for (let j = 1; j <= said.length; j++)
    dp[i][j] = flat[i - 1].w === said[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const hit = Array(flat.length).fill(false);
  let i = flat.length, j = said.length;
  while (i > 0 && j > 0) { if (flat[i - 1].w === said[j - 1]) { hit[i - 1] = true; i--; j--; } else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--; }
  const tokOk = toks.map(() => true); flat.forEach((f, k) => { if (!hit[k]) tokOk[f.ti] = false; });
  // Agrupa en tramos: lo bien dicho en verde y lo mal dicho en rojo; cada tramo se puede escuchar solo
  let segs = '', a = 0; const bad = [];
  while (a < toks.length) {
    let b = a; while (b < toks.length && tokOk[b] === tokOk[a]) b++;
    const seg = toks.slice(a, b).join(' '), clean = seg.replace(/[^\w'’ -]/g, '').trim();
    SAYS.push({ text: clean || seg, speed: tokOk[a] ? undefined : 'normal' });
    segs += `<button class="seg ${tokOk[a] ? 'seg-ok' : 'seg-bad'}" data-say="${SAYS.length - 1}" title="Toca para escuchar">${esc(seg)}</button>`;
    if (!tokOk[a]) { SAYS.push({ text: clean || seg, speed: 'lento' }); bad.push(`<span class="small">🔴 <b>${esc(seg)}</b></span> <button class="say" data-say="${SAYS.length - 2}">▶</button><button class="say" data-say="${SAYS.length - 1}">🐢</button>`); }
    a = b;
  }
  const c = r.score >= 85 ? 'green' : r.score >= 60 ? 'amber' : 'red';
  const msg = r.score >= 85 ? '¡Excelente pronunciación!' : r.score >= 60 ? '¡Casi! Revisa lo que está en rojo.' : 'Escucha cada parte en rojo y repite despacio.';
  const full = r.target || toks.join(' ');
  return `<div class="mt"><div class="row"><span class="tag ${c}">${r.score}%</span><span class="small">${msg}</span></div>
    <p class="small mt mb0"><b>Entendí:</b> "${esc(r.said)}"</p>
    <p class="mt mb0" style="line-height:2">${segs}</p>
    ${bad.length ? `<div class="tip mt"><p class="small mb0"><b>👆 Toca lo rojo para escuchar solo esa parte:</b></p>${bad.map(x => `<div class="row mt">${x}</div>`).join('')}</div>` : ''}
    <div class="row wrap mt">${sayBtn(full, '▶ Frase completa')}${sayBtn(full, '🐢 Frase lenta', 'lento')}<button class="say" data-deepsent="${esc(full)}">🔍 Explícame la frase</button></div></div>`;
}

let C = null;
function startConv(id) { C = { c: CONVERSATIONS.find(x => x.id === id), i: 0, log: [], ok: 0, waiting: true }; go('conv'); }

function renderConv(speakNow) {
  const c = C.c, turn = c.turns[C.i];

    return `<div class="bubble coach small">${m.html}</div>`;
  }).join('');
  let bottom = '';

    chat += jake(turn.en, turn.es, { hide });
    bottom = `<div class="card">
      ${micBlock('cmic')}
      <div class="row mt"><input type="text" id="ctext" placeholder="O escribe tu respuesta en inglés..." autocomplete="off"><button class="btn sm" id="csend">Enviar</button></div>

      <div id="chelpbox"></div></div>`;
  } else {
    const score = pct(C.ok, c.turns.length);
    S.convs[c.id] = Math.max(S.convs[c.id] || 0, score); addXP(15); save();
    bottom = `<div class="card center"><h2>🎉 ¡Conversación terminada!</h2><p class="big">${score}%</p><p class="muted">respuestas naturales</p>

  }

    <div class="card"><p class="tag">${c.level} · ${esc(c.title)}</p><p class="small mt mb0">${esc(c.setup)}</p></div>

  if (finished) { document.getElementById('again').onclick = () => startConv(c.id); window.scrollTo(0, document.body.scrollHeight); return; }
  window.scrollTo(0, document.body.scrollHeight);
  if (speakNow) setTimeout(() => speak(turn.en), 300);

  document.getElementById('csend').onclick = () => { const v = document.getElementById('ctext').value.trim(); if (v) submit(v); };
  document.getElementById('ctext').onkeydown = e => { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) submit(v); } };

    $app.querySelectorAll('[data-reveal]').forEach(x => { x.classList.remove('hidden-text'); x.removeAttribute('data-reveal'); });
    speak(turn.en, 'lento');
  };
  const m = document.getElementById('cmic');

    try { const alts = await listen(t => document.getElementById('cmic-st').textContent = '🎧 ' + t); m.classList.remove('on'); submit(alts[0]); }
    catch (e) { m.classList.remove('on'); micError(e, 'cmic-st'); }

}
function handleConvAnswer(text) {
  const turn = C.c.turns[C.i];
  const low = ' ' + norm(text).join(' ') + ' ';
  const lowRaw = ' ' + text.toLowerCase().replace(/[’`]/g, "'") + ' ';
  const ok = turn.expect.every(group => group.some(k => lowRaw.includes(k) || low.includes(' ' + norm(k).join(' '))));
  const longEnough = norm(text).length >= 1;
  C.log.push({ who: 'jake', en: turn.en, es: turn.es });
  C.log.push({ who: 'me', text });
  updSkill('speaking', ok, 0.12);
  if (ok && longEnough) {
    C.ok++;
    C.log.push({ who: 'jake', en: turn.ok });
    C.i++; save();
    speak(turn.ok).then(() => { if (screen === 'conv') renderConv(true); });
    renderConv(false);
  } else {
    addMistake({ type: 'speak', skill: 'speaking', en: turn.model.split(' / ')[0] });
    C.log.push({ who: 'coach', html: `<b>🧑‍🏫 Tip:</b> ${esc(turn.tip)}<br>Una respuesta natural sería: <b>"${esc(turn.model)}"</b>` });
    C.i++; save();
    renderConv(false);
    speak(turn.model.split(' / ')[0]).then(() => { if (screen === 'conv') setTimeout(() => renderConv(true), 600); });
  }
}

const DAY = 86400000;
const INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60]; // días según la "caja" de la tarjeta
function deckCards() {
  const my = LEVELS.indexOf(S.level);
  let ls = LESSONS.filter(l => (l.id in S.done) || LEVELS.indexOf(l.level) < my).concat(COURSE.filter(l => l.id in S.done));
  if (!ls.length) ls = LESSONS.slice(0, 2);
  const out = [];
  ls.forEach(l => l.vocab.forEach(v => out.push({ id: l.id + '|' + v[0], en: v[0], es: v[1], pr: v[2], tip: l.memo ? l.memo[0] : '', from: l.title })));
  (S.customCards || []).forEach(c => out.push(Object.assign({ from: c.from || 'Tus canciones' }, c)));
  return out;
}
function dueCards() {
  S.cards = S.cards || {};
  const now = Date.now();
  const all = deckCards();
  const old = all.filter(c => S.cards[c.id] && S.cards[c.id].due <= now);
  const fresh = all.filter(c => !S.cards[c.id]).slice(0, 8);
  return old.concat(fresh);
}

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('ingles-jake', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('songs', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function songsAll() { const db = await idb(); return new Promise(res => { const q = db.transaction('songs').objectStore('songs').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); }
async function songPut(s) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('songs', 'readwrite'); t.objectStore('songs').put(s); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function songDel(id) { const db = await idb(); return new Promise(res => { const t = db.transaction('songs', 'readwrite'); t.objectStore('songs').delete(id); t.oncomplete = res; }); }

// Busca expresiones en un texto y devuelve [{e, start, end}]
function findExpr(line) {
  const hits = [];
  EXPRESSIONS.forEach(e => {
    const m = line.match(e.re);
    if (!m) return;
    let start = m.index, txt = m[0];
    const lead = txt.match(/^[^a-z'’]*/i)[0].length; start += lead; txt = txt.slice(lead);
    hits.push({ e, start, end: start + txt.length, txt });
  });
  hits.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const out = []; let last = -1;
  hits.forEach(h => { if (h.start >= last) { out.push(h); last = h.end; } });
  return out;
}
function markLine(line) {
  const hits = findExpr(line); let html = '', pos = 0;
  hits.forEach(h => { html += esc(line.slice(pos, h.start)) + `<span class="expr">${esc(line.slice(h.start, h.end))}</span>`; pos = h.end; });
  return html + esc(line.slice(pos));
}

function findAllExpr(lyrics) {
  const map = new Map();
  (lyrics || '').split('\n').forEach((line, i) => findExpr(line).forEach(h => { if (!map.has(h.e.k)) map.set(h.e.k, { e: h.e, line, i }); }));
  return [...map.values()];
}

/* ---------- Servicios externos (gratuitos, sin cuenta) ----------
   - YouTube / Spotify / noembed: saber qué canción es a partir del link
   - LRCLIB: letra de la canción (muchas veces con tiempos por verso)
   - MyMemory: traducción automática de versos y palabras */
function parseSongUrl(u) {
  u = (u || '').trim();
  let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return { provider: 'youtube', id: m[1], url: u };
  m = u.match(/open\.spotify\.com\/(?:intl-[\w-]+\/)?track\/(\w+)/);
  if (m) return { provider: 'spotify', id: m[1], url: u };
  if (/^https?:\/\//i.test(u)) return { provider: 'link', url: u };
  return null;
}
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

    if (p.provider === 'youtube') { const d = await getJSON('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + p.id)); title = d.title; author = d.author_name; }
    else if (p.provider === 'spotify') { const d = await getJSON('https://open.spotify.com/oembed?url=' + encodeURIComponent(p.url)); title = d.title; author = ''; }
    else { const d = await getJSON('https://noembed.com/embed?url=' + encodeURIComponent(p.url)); title = d.title || ''; author = d.author_name || ''; }
  } catch (e) {}

}
function cleanSongTitle(title, author) {
  let t = (title || '').replace(/[–—]/g, '-').replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').replace(/\s+(ft\.?|feat\.?|featuring)\s.*$/i, '').replace(/\s*\|.*$/, '').trim();
  t = t.replace(/\s*-\s*(remaster(ed)?( \d{4})?|\d{4} remaster(ed)?|official.*|lyrics?.*|audio|video)$/i, '').trim();
  let artist = '', track = t;
  const parts = t.split(/\s+-\s+/);
  if (parts.length >= 2) { artist = parts[0].trim(); track = parts.slice(1).join(' - ').trim(); }
  else artist = (author || '').replace(/\s*-\s*topic$/i, '').replace(/vevo$/i, '').replace(/\s*official$/i, '').trim();
  return { artist, track, raw: title };
}
async function searchLyrics(artist, track) {
  const base = 'https://lrclib.net/api/search?';
  let res = [];
  try { if (artist && track) res = await getJSON(base + 'track_name=' + encodeURIComponent(track) + '&artist_name=' + encodeURIComponent(artist)); } catch (e) {}
  if (!res.length) { try { res = await getJSON(base + 'q=' + encodeURIComponent((artist + ' ' + track).trim())); } catch (e) {} }
  if (!res.length && track) { try { res = await getJSON(base + 'q=' + encodeURIComponent(track)); } catch (e) {} }
  return res.filter(r => r.plainLyrics || r.syncedLyrics).slice(0, 6);
}
function parseLRC(lrc) {

  (lrc || '').split('\n').forEach(row => {
    const tags = [...row.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const text = row.replace(/\[[^\]]*\]/g, '').trim();
    if (!tags.length || !text) return;
    tags.forEach(t => { lines.push({ t: +t[1] * 60 + +t[2], text }); });
  });
  lines.sort((a, b) => a.t - b.t);

}

async function translate(text) {
  const k = text.trim().toLowerCase(); if (!k) return '';

  const d = await getJSON('https://api.mymemory.translated.net/get?langpair=en|es&q=' + encodeURIComponent(text.slice(0, 480)));

}

function makePlayer() {
  const s = SG.song;
  if (SG.url) {
    const au = document.getElementById('au');
    SG.P = { time: () => au.currentTime, seek: t => { au.currentTime = t; }, play: () => au.play(), pause: () => au.pause(), paused: () => au.paused };
  } else if (s.videoId) {
    loadYT().then(() => {
      if (screen !== 'song' || !document.getElementById('yt')) return;
      const pl = new YT.Player('yt', { videoId: s.videoId, width: '100%', height: '200', playerVars: { playsinline: 1, rel: 0 },
        events: { onReady: () => { SG.P = { time: () => pl.getCurrentTime() || 0, seek: t => pl.seekTo(t, true), play: () => pl.playVideo(), pause: () => pl.pauseVideo(), paused: () => pl.getPlayerState() !== 1 }; if (SG.tab === 'sync') renderSongBody(); } } });
    });
  }
  clearInterval(songTick);
  songTick = setInterval(() => {
    if (screen !== 'song') { clearInterval(songTick); return; }
    const P = SG.P; if (!P) return;
    const t = P.time();
    if (SG.stopAt != null && t >= SG.stopAt) { P.pause(); SG.stopAt = null; }
    if (SG.tab !== 'letra') return;
    let cur = -1; s.marks.forEach((m, i) => { if (m != null && t >= m) cur = i; });
    if (cur !== SG.cur) {

      if (el && SG.follow && !P.paused()) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

      ${synced ? `<p class="small">✅ Esta canción ya tiene ${synced} de ${lines.length} versos sincronizados. Solo vuelve a hacerlo si no coinciden.</p>` : '<p class="small">Así cada verso se ilumina mientras suena y puedes repetir solo esa parte.</p>'}
      <p class="small">Dale play y toca el botón grande <b>justo cuando empiece cada verso</b>.</p>
      ${!SG.P ? '<p class="small muted">Cargando el reproductor...</p>' : SG.sync < 0 ? '<button class="btn block red" id="sstart">▶ Empezar a sincronizar</button>' : `
        <p class="small muted mb0">Siguiente verso:</p><p class="en" id="snext" style="font-size:1.15rem">${esc(lines[SG.sync] || '')}</p>
        <button class="btn block green" id="smark" style="min-height:72px;font-size:1.1rem">👆 Empieza este verso (${SG.sync + 1}/${lines.length})</button>
        <button class="btn block ghost mt" id="sstop">Terminar</button>`}</div>`
      : '<div class="card"><p class="mb0">Para sincronizar necesito poder controlar la canción: usa un archivo de audio o un link de YouTube.</p></div>';
  }
  const bodyEl = document.getElementById('song-body'); bodyEl.innerHTML = body;
  bindSongBody(s, lines);
}
function bindSongBody(s, lines) {
  const bodyEl = document.getElementById('song-body');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { SG.tab = b.dataset.tab; SG.open = -1; SG.cur = -2; renderSongBody(); });
  bodyEl.querySelectorAll('[data-line]').forEach(d => d.onclick = e => {
    if (e.target.closest('.say,a,button')) return;
    const i = +d.dataset.line; SG.open = SG.open === i ? -1 : i; SG.cur = -2; SG.follow = false; renderSongBody(); playLine(i);
  });
  bodyEl.querySelectorAll('[data-word]').forEach(b => b.onclick = async () => {
    const w = b.dataset.word, box = document.getElementById('wbox');
    speak(w, 'normal');
    const known = EXPRESSIONS.find(e => !e.k.includes(' ') && e.re.test(' ' + w + ' '));
    box.innerHTML = `<p class="mb0"><b>${esc(w)}</b>${known ? ` <span class="tag amber">${TYPE_NAMES[known.type]}</span> — ${esc(known.es)}` : ''} <span id="wtr" class="muted">· traduciendo...</span></p>`;
    try { const t = await translate(w); const el = document.getElementById('wtr'); if (el) el.textContent = '· 🌐 ' + t; }
    catch (e) { const el = document.getElementById('wtr'); if (el) el.textContent = '· (sin conexión para traducir)'; }
  });
  bodyEl.querySelectorAll('[data-trline]').forEach(b => b.onclick = async () => {
    const i = +b.dataset.trline; b.textContent = '🌐 Traduciendo...';
    try { s.tr[i] = await translate(lines[i]); await songPut(s); renderSongBody(); }
    catch (e) { b.textContent = e.message === 'quota' ? 'Se acabaron las traducciones de hoy' : 'Sin conexión'; }
  });
  const ta = document.getElementById('tr-all');
  if (ta) ta.onclick = async () => {
    ta.disabled = true; const st = document.getElementById('tr-st');
    for (let i = 0; i < lines.length; i++) {
      if (s.tr[i]) continue;
      st.textContent = `Traduciendo verso ${i + 1} de ${lines.length}...`;
      try { s.tr[i] = await translate(lines[i]); }
      catch (e) { st.textContent = e.message === 'quota' ? 'Se acabó el límite gratis de traducciones de hoy. Mañana sigo con el resto.' : 'Sin conexión. Intenta de nuevo.'; break; }
    }
    await songPut(s); if (screen === 'song' && SG.tab === 'letra') renderSongBody();
  };
  bodyEl.querySelectorAll('[data-addcard]').forEach(b => b.onclick = () => {
    const k = b.dataset.addcard; S.customCards = S.customCards || [];
    if (!S.customCards.some(c => c.en === k)) {
      const e = EXPRESSIONS.find(x => x.k === k);
      S.customCards.push({ id: 'song|' + k, en: k, es: e ? e.es : '', pr: '', tip: '', from: s.title }); save(); toast('Agregada a Memoria 🧠');
    }
    b.textContent = '✓';
  });
  const notes = document.getElementById('notes'); if (notes) notes.onchange = () => { s.notes = notes.value; songPut(s); };
  const qa = document.getElementById('qagain'); if (qa) qa.onclick = () => { SG.quiz = null; renderSongBody(); };
  const qok = document.getElementById('qok');
  if (qok) {
    const Q = SG.quiz, it = Q.items[Q.k];
    const qp = document.getElementById('qplay'); if (qp) qp.onclick = () => playLine(it.i);
    const check = () => {
      if (Q.answered) { Q.k++; Q.answered = false; renderSongBody(); return; }
      const v = document.getElementById('qin').value.trim().toLowerCase().replace(/[’]/g, "'").replace(/[^a-z']/g, '');
      const ok = v === it.target.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z']/g, '');
      Q.answered = true; if (ok) Q.ok++; updSkill('listening', ok, 0.08); save();
      const hits = findExpr(it.line);
      document.getElementById('qfb').innerHTML = `<div class="tip mt">${ok ? '✅ ¡Exacto!' : `❌ Era: <b>${esc(it.target)}</b>`}<br><span class="small">${markLine(it.line)}</span>
        ${hits.length ? `<br><span class="small">💡 <b>${esc(hits[0].txt)}</b>: ${esc(hits[0].e.es)}</span>` : ''}${s.tr[it.i] ? `<br><span class="small">🇲🇽 ${esc(s.tr[it.i])}</span>` : ''}</div>`;
      qok.textContent = 'Siguiente';
    };
    qok.onclick = check;
    document.getElementById('qin').onkeydown = e => { if (e.key === 'Enter') check(); };
  }
  const ss = document.getElementById('sstart');
  if (ss) ss.onclick = () => { s.marks = []; SG.sync = 0; renderSongBody(); SG.P.seek(0); SG.P.play(); };
  const sm = document.getElementById('smark');
  if (sm) {
    sm.onclick = () => {
      s.marks[SG.sync] = Math.max(0, SG.P.time() - 0.2); SG.sync++;
      if (SG.sync >= lines.length) { SG.sync = -1; songPut(s); toast('✅ ¡Letra sincronizada!'); SG.tab = 'letra'; renderSongBody(); return; }
      document.getElementById('snext').textContent = lines[SG.sync];
      sm.textContent = `👆 Empieza este verso (${SG.sync + 1}/${lines.length})`;
    };
    document.getElementById('sstop').onclick = () => { SG.sync = -1; songPut(s); renderSongBody(); };
  }
}
